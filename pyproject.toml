[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "estimate-gap"
version = "0.1.0"
description = "Read-only, line-by-line gap check between two collision repair estimates."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
estimate-gap = "estimate_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
estimate_gap = ["rules/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
